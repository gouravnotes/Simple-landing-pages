<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Minimal Facebook search homepage">
<title>Facebook</title>

<style>
:root{
  --bg:#000;
  --fg:#fff;
  --muted:#777;
  --soft:rgba(255,255,255,.08);

  /* Reconstructed 2004 thefacebook palette */
  --fb-blue:#21579a;
  --fb-light:#2489dd;

  --page:clamp(18px,5vw,72px);
  --content:760px;

  --safe-top:env(safe-area-inset-top,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
}

*,
*::before,
*::after{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-width:320px;
  min-height:100%;
  margin:0;
  background:var(--bg);
}

body{
  min-height:100svh;
  padding:
    max(var(--page),var(--safe-top))
    max(var(--page),var(--safe-right))
    max(var(--page),var(--safe-bottom))
    max(var(--page),var(--safe-left));

  display:grid;
  place-items:center;
  overflow-x:hidden;

  background:var(--bg);
  color:var(--fg);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  -webkit-tap-highlight-color:transparent;
  text-rendering:optimizeLegibility;
  transition:background-color .2s ease,color .2s ease;
}

body.beige{
  --bg:#f2eadb;
  --fg:#171512;
  --muted:#81786b;
  --soft:rgba(23,21,18,.08);
}

.container{
  width:min(100%,var(--content));
  max-width:100%;
  margin-inline:auto;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/*
  Reconstructed the 2004 Facebook wordmark.

  Historical references describe the original mark as:
  - lowercase "thefacebook"
  - no space
  - light blue lettering
  - dark blue rectangular field
  - square-bracket framing

  The original uploaded SVG was inspected for its proportions and palette.
  This version deliberately uses HTML/CSS text instead of the SVG.
*/
.thefacebook-logo{
  display:flex;
  align-items:center;
  justify-content:center;

  width:clamp(205px,38vw,300px);
  max-width:78vw;

  padding:clamp(12px,1.5vw,16px) clamp(15px,2.2vw,22px);

  background:var(--fb-blue);
  color:var(--fb-light);

  border-radius:4px;

  text-decoration:none;
  overflow:hidden;
}

.thefacebook-wordmark{
  display:block;
  white-space:nowrap;

  color:var(--fb-light);

  /*
    A compact sans-serif stack approximates the early utilitarian
    university-web lettering without depending on an external font.
  */
  font-family:
    Arial,
    "Helvetica Neue",
    Helvetica,
    sans-serif;

  font-size:clamp(22px,4vw,31px);
  font-stretch:normal;
  font-weight:700;
  letter-spacing:-1.55px;
  line-height:1;

  text-rendering:geometricPrecision;
}

.thefacebook-wordmark::before{
  content:"[";
  margin-right:.20em;
}

.thefacebook-wordmark::after{
  content:"]";
  margin-left:.20em;
}

.search-form{
  width:100%;
  max-width:100%;
  min-width:0;

  display:flex;
  align-items:center;

  padding-inline:clamp(30px,9vw,112px);
  margin-top:38px;
}

.search-input{
  flex:1 1 auto;
  min-width:0;
  width:100%;
  height:48px;

  padding:0 7px;

  border:0;
  outline:0;
  box-shadow:none;

  background:transparent;
  color:var(--fg);
  caret-color:var(--fb-light);

  font:400 clamp(16px,2vw,19px) monospace;

  appearance:none;
  -webkit-appearance:none;
}

.search-input::placeholder{
  color:var(--muted);
  opacity:1;
}

.search-input:focus,
.search-input:focus-visible{
  border:0;
  outline:0;
  box-shadow:none;
}

.search-button{
  width:44px;
  height:44px;
  flex:0 0 44px;

  display:grid;
  place-items:center;

  padding:0;
  border:0;
  border-radius:50%;

  background:transparent;
  color:var(--fg);

  cursor:pointer;
  touch-action:manipulation;

  transition:
    background .15s ease,
    transform .1s ease;
}

.search-button:hover{
  background:var(--soft);
}

.search-button:active{
  transform:scale(.93);
}

.search-button:focus-visible{
  outline:1px solid currentColor;
  outline-offset:3px;
}

.search-button svg{
  width:21px;
  height:21px;
}

.shortcuts{
  width:100%;
  max-width:100%;

  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;

  column-gap:clamp(14px,3vw,28px);
  row-gap:8px;

  margin-top:31px;
  padding-inline:8px;
}

.shortcut{
  min-height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:4px 2px;

  border:0;
  background:transparent;
  color:var(--fg);

  text-decoration:none;

  font-size:clamp(12px,1.5vw,14px);
  font-weight:500;
  letter-spacing:.01em;
  white-space:nowrap;

  transition:
    opacity .15s ease,
    transform .1s ease;
}

.shortcut:hover{
  opacity:.58;
  transform:translateY(-1px);
}

.shortcut:active{
  transform:scale(.96);
}

.shortcut:focus-visible{
  outline:1px solid currentColor;
  outline-offset:3px;
}

.theme-button{
  position:fixed;
  z-index:5;

  top:max(12px,var(--safe-top));
  right:max(12px,var(--safe-right));

  width:38px;
  height:38px;

  display:grid;
  place-items:center;

  padding:0;
  border:0;
  border-radius:50%;

  background:transparent;
  color:var(--fg);

  cursor:pointer;

  transition:
    background .15s ease,
    transform .1s ease;
}

.theme-button:hover{
  background:var(--soft);
}

.theme-button:active{
  transform:scale(.92);
}

.theme-button:focus-visible{
  outline:1px solid currentColor;
  outline-offset:3px;
}

.theme-button svg{
  width:18px;
  height:18px;
}

.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

@media(max-width:600px){
  .thefacebook-logo{
    width:230px;
    max-width:76vw;
  }

  .thefacebook-wordmark{
    font-size:25px;
  }

  .search-form{
    padding-inline:clamp(22px,7vw,38px);
  }

  .shortcuts{
    column-gap:16px;
    margin-top:25px;
  }
}

@media(max-width:420px){
  .thefacebook-logo{
    width:215px;
    max-width:75vw;
    padding:9px 13px;
  }

  .thefacebook-wordmark{
    font-size:23px;
    letter-spacing:-1.35px;
  }

  .shortcuts{
    column-gap:13px;
  }

  .shortcut{
    font-size:12px;
  }
}

@media(max-width:340px){
  .thefacebook-logo{
    width:200px;
    max-width:72vw;
  }

  .thefacebook-wordmark{
    font-size:21px;
    letter-spacing:-1.2px;
  }

  .search-form{
    padding-inline:18px;
  }

  .shortcuts{
    column-gap:10px;
  }

  .shortcut{
    font-size:11px;
  }
}

@media(max-height:480px) and (orientation:landscape){
  .thefacebook-logo{
    width:210px;
    margin-top:0;
  }

  .search-form{
    margin-top:18px;
  }

  .shortcuts{
    margin-top:13px;
  }
}

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    transition:none!important;
  }
}
</style>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

</head>

<body>

<button
  class="theme-button"
  id="themeButton"
  type="button"
  aria-label="Toggle nostalgic beige theme"
  title="Toggle theme"
>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  </svg>
</button>

<main class="container">

  <!-- HTML/CSS reconstruction of the 2004 thefacebook logo -->
  <a
    class="thefacebook-logo"
    href="https://www.facebook.com/"
    aria-label="Facebook home"
  >
    <span class="thefacebook-wordmark">thefacebook</span>
  </a>

  <form
    class="search-form"
    id="searchForm"
    action="https://www.facebook.com/search/top/"
    method="get"
    role="search"
    autocomplete="off"
  >
    <label class="sr-only" for="SearchValue">Search Facebook</label>

    <input
      id="SearchValue"
      class="search-input"
      type="search"
      name="q"
      placeholder="Search"
      aria-label="Search Facebook"
      spellcheck="false"
      autocapitalize="off"
      enterkeyhint="search"
      required
    >

    <button
      class="search-button"
      type="submit"
      aria-label="Search Facebook"
      title="Search Facebook"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <circle cx="10.5" cy="10.5" r="6.7"/>
        <path d="M15.5 15.5 21 21"/>
      </svg>
    </button>
  </form>

  <nav class="shortcuts" aria-label="Facebook shortcuts">
    <a class="shortcut" href="https://www.facebook.com/">Home</a>
    <a class="shortcut" href="https://www.facebook.com/search/top/">Search</a>
    <a class="shortcut" href="https://www.facebook.com/notifications/">Notifications</a>
    <a class="shortcut" href="https://www.facebook.com/composer/">Create Post</a>
    <a class="shortcut" href="https://www.facebook.com/friends/">Friends</a>
    <a class="shortcut" href="https://www.facebook.com/groups/">Groups</a>
    <a class="shortcut" href="https://www.facebook.com/events/">Events</a>
    <a class="shortcut" href="https://www.facebook.com/watch/">Watch</a>
  </nav>

</main>

<script>
(() => {
  const button = document.getElementById("themeButton");
  const searchForm = document.querySelector(".search-form");
  const searchInput = document.getElementById("SearchValue");
  const saved = localStorage.getItem("facebook-home-theme");

  if (saved === "beige") {
    document.body.classList.add("beige");
  }

  button.addEventListener("click", () => {
    document.body.classList.toggle("beige");

    localStorage.setItem(
      "facebook-home-theme",
      document.body.classList.contains("beige")
        ? "beige"
        : "black"
    );
  });

  searchForm.addEventListener("submit", () => {
    // Let the browser perform the native GET navigation.
    // Clearing the field does not cancel the submission.
    setTimeout(() => {
      searchInput.value = "";
    }, 0);
  });
})();
</script>


<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>

</body>
</html>
