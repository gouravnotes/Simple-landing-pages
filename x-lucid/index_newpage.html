<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Minimal X search homepage">
<title>X</title>

<style>
:root{
  --bg:#000;
  --fg:#fff;
  --muted:#777;
  --soft:rgba(255,255,255,.08);
  --page:clamp(26px,8vw,110px);
  --content:800px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
}
*,
*::before,
*::after{box-sizing:border-box}
html,body{
  width:100%;min-width:320px;min-height:100%;margin:0;background:var(--bg)
}
body{
  min-height:100svh;
  padding:max(var(--page),var(--safe-top)) max(var(--page),var(--safe-right))
          max(var(--page),var(--safe-bottom)) max(var(--page),var(--safe-left));
  display:grid;place-items:center;overflow-x:hidden;
  background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;text-rendering:optimizeLegibility;
  transition:background-color .2s ease,color .2s ease;
}
body.beige{
  --bg:#f2eadb;
  --fg:#171512;
  --muted:#81786b;
  --soft:rgba(23,21,18,.08);
}
.container{
  width:min(100%,var(--content));
  max-width:100%;
  margin-inline:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* X mark: fluid but bounded, with a fixed aspect ratio. */
.brand{
  width:clamp(76px,10vw,96px);
  max-width:58vw;
  aspect-ratio:1;
  display:grid;
  place-items:center;
  margin:0 auto 38px;
  color:var(--fg);
  text-decoration:none;
}
.brand svg{
  width:100%;
  height:100%;
  display:block;
}

/* Search */
.search-form{
  width:100%;
  max-width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  padding-inline:clamp(30px,9vw,112px);
}
.search-input{
  flex:1 1 auto;
  min-width:0;
  width:100%;
  height:48px;
  padding:0 7px;
  border:0;
  outline:0;
  box-shadow:none;
  background:transparent;
  color:var(--fg);
  caret-color:var(--fg);
  font:400 clamp(16px,2vw,19px) monospace;
  appearance:none;
  -webkit-appearance:none;
}
.search-input::placeholder{color:var(--muted);opacity:1}
.search-input:focus,.search-input:focus-visible{
  border:0;outline:0;box-shadow:none
}
.search-button{
  width:44px;height:44px;flex:0 0 44px;
  display:grid;place-items:center;
  padding:0;border:0;border-radius:50%;
  background:transparent;color:var(--fg);
  cursor:pointer;touch-action:manipulation;
  transition:background .15s ease,transform .1s ease
}
.search-button:hover{background:var(--soft)}
.search-button:active{transform:scale(.93)}
.search-button:focus-visible{outline:1px solid currentColor;outline-offset:3px}
.search-button svg{width:21px;height:21px}

/* Text navigation */
.shortcuts{
  width:100%;
  max-width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  column-gap:clamp(14px,2.8vw,27px);
  row-gap:8px;
  margin-top:31px;
  padding-inline:8px;
}
.shortcut{
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:4px 2px;
  border:0;
  background:transparent;
  color:var(--fg);
  text-decoration:none;
  font-size:clamp(12px,1.5vw,14px);
  font-weight:500;
  letter-spacing:.01em;
  white-space:nowrap;
  transition:opacity .15s ease,transform .1s ease;
}
.shortcut:hover{opacity:.58;transform:translateY(-1px)}
.shortcut:active{transform:scale(.96)}
.shortcut:focus-visible{outline:1px solid currentColor;outline-offset:3px}
.shortcut.icon{width:40px;min-width:40px;padding:0}.shortcut.icon svg{width:19px;height:19px;display:block}

/* Special Post action */
.shortcut.icon-link{
  width:38px;
  height:38px;
  flex:0 0 38px;
  padding:0;
}
.shortcut.icon-link svg{
  width:19px;
  height:19px;
}
.shortcut.post{
  min-height:40px;
  padding:8px 16px;
  border-radius:999px;
  background:var(--fg);
  color:var(--bg);
  font-weight:700;
  font-size:clamp(13px,1.6vw,15px);
}
.shortcut.post:hover{
  opacity:1;
  transform:translateY(-1px);
}
.shortcut.post:active{transform:scale(.95)}
.shortcut.post:focus-visible{
  outline:1px solid currentColor;
  outline-offset:4px;
}

.theme-button{
  position:fixed;
  z-index:5;
  top:max(12px,var(--safe-top));
  right:max(12px,var(--safe-right));
  width:38px;height:38px;
  display:grid;place-items:center;
  padding:0;border:0;border-radius:50%;
  background:transparent;color:var(--fg);
  cursor:pointer;
  transition:background .15s ease,transform .1s ease
}
.theme-button:hover{background:var(--soft)}
.theme-button:active{transform:scale(.92)}
.theme-button:focus-visible{outline:1px solid currentColor;outline-offset:3px}
.theme-button svg{width:18px;height:18px}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0
}

@media(max-width:600px){
  .brand{width:86px;margin-bottom:28px}
  .search-form{padding-inline:clamp(22px,7vw,38px)}
  .shortcuts{column-gap:16px;margin-top:25px}
}
@media(max-width:420px){
  .brand{width:82px;max-width:65vw}
  .shortcuts{column-gap:13px}
  .shortcut{font-size:12px}.shortcut.icon{width:38px;min-width:38px}
  .shortcut.post{padding:7px 14px;font-size:13px}
}
@media(max-width:340px){
  .brand{width:78px;max-width:62vw}
  .search-form{padding-inline:18px}
  .shortcuts{column-gap:10px}
  .shortcut{font-size:11px}.shortcut.icon{width:36px;min-width:36px}
}
@media(max-height:480px) and (orientation:landscape){
  .brand{width:74px;margin-bottom:14px}
  .search-form{margin-top:0}
  .shortcuts{margin-top:13px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important}
}
</style>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="X">
<link rel="apple-touch-icon" href="./icons/icon-192.png">

</head>

<body>

<button class="theme-button" id="themeButton" type="button"
        aria-label="Toggle nostalgic beige theme" title="Toggle theme">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  </svg>
</button>

<main class="container">

  <!-- X logo -->
  <a class="brand" href="https://x.com/" aria-label="X home" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" role="img" aria-labelledby="xTitle" xmlns="http://www.w3.org/2000/svg">
      <title id="xTitle">X</title>
      <g fill="currentColor">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </g>
    </svg></a>

  <form class="search-form"
        action="https://x.com/search"
        method="get"
        target="_blank"
        role="search"
        autocomplete="off">
    <label class="sr-only" for="SearchValue">Search X</label>
    <input id="SearchValue" class="search-input"
           type="search"
           name="q"
           placeholder="Search"
           aria-label="Search X"
           spellcheck="false"
           autocapitalize="off"
           enterkeyhint="search"
           required>
    <button class="search-button"
            type="submit"
            aria-label="Search X"
            title="Search X">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="10.5" cy="10.5" r="6.7"/>
        <path d="M15.5 15.5 21 21"/>
      </svg>
    </button>
  </form>

  <nav class="shortcuts" aria-label="X shortcuts">

    <!-- Icon group first -->
    <a class="shortcut icon-link" href="https://x.com/home" aria-label="Home" title="Home" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3.5 10 8.5-7 8.5 7"/>
        <path d="M5.5 9.5V21h13V9.5"/>
        <path d="M9.5 21v-6h5v6"/>
      </svg>
    </a>

    <a class="shortcut icon-link" href="https://x.com/search" aria-label="Search" title="Search" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="10.5" cy="10.5" r="6.7"/>
        <path d="M15.5 15.5 21 21"/>
      </svg>
    </a>

    <a class="shortcut icon-link" href="https://x.com/messages" aria-label="Messages" title="Messages" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5.5h16v11H9l-5 3v-14Z"/>
        <path d="M8 9.5h8M8 13h5"/>
      </svg>
    </a>

    <a class="shortcut icon-link" href="https://x.com/notifications" aria-label="Notifications" title="Notifications" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 17.5h11l-1.5-2v-4.2a4 4 0 0 0-8 0v4.2l-1.5 2Z"/>
        <path d="M10 20h4"/>
      </svg>
    </a>

    <!-- Special Post action -->
    <a class="shortcut post" href="https://x.com/compose/post" target="_blank" rel="noopener noreferrer">Post</a>

    <!-- Text group after the icon group and Post -->
    
    <a class="shortcut" href="https://x.com/i/bookmarks" target="_blank" rel="noopener noreferrer">Bookmarks</a>
    <a class="shortcut" href="https://x.com/i/lists" target="_blank" rel="noopener noreferrer">Lists</a>
    <a class="shortcut" href="https://x.com/i/communities" target="_blank" rel="noopener noreferrer">Communities</a>

  </nav>

</main>

<script>
(() => {
  const button = document.getElementById("themeButton");
  const searchForm = document.querySelector(".search-form");
  const searchInput = document.getElementById("SearchValue");
  const saved = localStorage.getItem("x-home-theme");

  if (saved === "beige") {
    document.body.classList.add("beige");
  }

  button.addEventListener("click", () => {
    document.body.classList.toggle("beige");
    localStorage.setItem(
      "x-home-theme",
      document.body.classList.contains("beige") ? "beige" : "black"
    );
  });

  searchForm.addEventListener("submit", () => {
    // Let the normal X search request happen, then clear the field.
    setTimeout(() => {
      searchInput.value = "";
    }, 0);
  });
})();
</script>


<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>

</body>
</html>
