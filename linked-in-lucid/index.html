<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Minimal LinkedIn search homepage">
<title>LinkedIn</title>

<style>
:root{
  --bg:#000;
  --fg:#fff;
  --muted:#777;
  --soft:rgba(255,255,255,.08);
  --accent:#0a66c2;
  --page-margin:clamp(18px,5vw,72px);
  --content:760px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
}

*,
*::before,
*::after{box-sizing:border-box}

html{
  width:100%;
  min-width:0;
  min-height:100%;
  overflow-x:hidden;
}

body{
  width:100%;
  min-width:0;
  min-height:100svh;
  margin:0;
  padding:
    max(var(--page-margin),var(--safe-top))
    max(var(--page-margin),var(--safe-right))
    max(var(--page-margin),var(--safe-bottom))
    max(var(--page-margin),var(--safe-left));
  background:var(--bg);
  color:var(--fg);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  text-rendering:optimizeLegibility;
  transition:background-color .2s ease,color .2s ease;
}

body.beige{
  --bg:#f2eadb;
  --fg:#171512;
  --muted:#81786b;
  --soft:rgba(23,21,18,.08);
}

.container{
  width:min(100%,var(--content));
  max-width:var(--content);
  min-width:0;
  margin-inline:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.brand{
  width:clamp(156px,24vw,194px);
  max-width:70vw;
  height:auto;
  flex:0 0 auto;
  display:block;
  margin:0 auto 38px;
  color:var(--fg);
  text-decoration:none;
}

.brand svg{
  width:100%;
  height:auto;
  display:block;
}

.search-form{
  width:100%;
  max-width:100%;
  min-width:0;
  display:flex;
  align-items:center;
  padding-inline:clamp(30px,9vw,112px);
}

.search-input{
  flex:1 1 auto;
  min-width:0;
  width:100%;
  height:48px;
  padding:0 7px;
  border:0;
  outline:0;
  box-shadow:none;
  background:transparent;
  color:var(--fg);
  caret-color:var(--accent);
  font:400 clamp(16px,2vw,19px) monospace;
  appearance:none;
  -webkit-appearance:none;
}

.search-input::placeholder{color:var(--muted);opacity:1}
.search-input:focus,
.search-input:focus-visible{border:0;outline:0;box-shadow:none}

.shortcuts{
  width:100%;
  max-width:100%;
  min-width:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin-top:31px;
  padding-inline:8px;
}

.shortcut{
  width:40px;
  height:40px;
  min-width:40px;
  flex:0 0 40px;
  display:grid;
  place-items:center;
  border:0;
  background:transparent;
  color:var(--fg);
  text-decoration:none;
  transition:opacity .15s ease,transform .1s ease;
}

.shortcut:hover{opacity:.58;transform:translateY(-1px)}
.shortcut:active{transform:scale(.93)}
.shortcut:focus-visible{outline:1px solid currentColor;outline-offset:3px}
.shortcut svg{width:18px;height:18px;display:block}

.theme-button{
  position:fixed;
  z-index:5;
  top:max(12px,var(--safe-top));
  right:max(12px,var(--safe-right));
  width:38px;
  height:38px;
  min-width:38px;
  min-height:38px;
  display:grid;
  place-items:center;
  padding:0;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--fg);
  cursor:pointer;
  transition:background .15s ease,transform .1s ease;
}

.theme-button:hover{background:var(--soft)}
.theme-button:active{transform:scale(.92)}
.theme-button:focus-visible{outline:1px solid currentColor;outline-offset:3px}
.theme-button svg{width:18px;height:18px}

.sr-only{
  position:absolute;
  width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);
  white-space:nowrap;border:0;
}

.job-search{
  width:100%;
  max-width:min(760px,100%);
  min-width:0;
  margin-top:0;
  display:block;
}

.job-search-form{
  width:100%;
  min-width:0;
  transform:scale(.6);
  transform-origin:center center;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px 10px 16px;
  border:2px solid var(--soft);
  border-radius:50px;
  background:rgba(255,255,255,.03);
}

body.beige .job-search-form{
  background:rgba(134,129,120,0);
}

.job-search-input{
  flex:1 1 0;
  min-width:0;
  width:0;
  height:42px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--fg);
  font:400 15px monospace;
}

.job-search-input::placeholder{color:var(--muted);opacity:1}
.job-search-input:focus{outline:0}

.job-search-divider{
  width:1px;
  height:26px;
  flex:0 0 1px;
  background:var(--soft);
}

.job-search-button{
  width:34px;
  height:34px;
  min-width:34px;
  min-height:34px;
  flex:0 0 34px;
  display:grid;
  place-items:center;
  padding:0;
  border:0;
  border-radius:50%;
  background:var(--fg);
  color:var(--bg);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .1s ease,opacity .15s ease;
}

.job-search-button:hover{opacity:.85}
.job-search-button:active{transform:scale(.93)}
.job-search-button:focus-visible{outline:1px solid currentColor;outline-offset:3px}
.job-search-button svg{width:16px;height:16px}

.job-search-label{
  margin:0 0 8px 2px;
  color:var(--muted);
  font:500 11px/1 monospace;
  letter-spacing:.08em;
  text-transform:uppercase;
}

/*
  Responsive behavior:
  Keep the actual search controls and shortcut sizes intact.
  Only available space, spacing, wrapping and vertical positioning change.
*/

@media (max-width:600px){
  :root{
    --page-margin:clamp(14px,4vw,28px);
  }

  body{
    align-items:center;
    justify-content:center;
  }

  .container{
    width:100%;
    max-width:760px;
    padding-block:clamp(10px,5vh,42px);
  }

  .brand{
    margin-bottom:clamp(24px,7vw,38px);
  }

  .search-form{
    padding-inline:clamp(22px,7vw,112px);
  }

  .shortcuts{
    gap:8px;
    margin-top:clamp(22px,6vw,31px);
    padding-inline:4px;
  }

  .job-search{
    width:100%;
  }
}

@media (max-width:420px){
  .brand{
    width:170px;
    margin-bottom:28px;
  }

  .search-form{
    padding-inline:clamp(22px,7vw,36px);
  }

  .shortcuts{
    gap:7px;
    margin-top:25px;
  }

  .shortcut{
    width:38px;
    height:38px;
    min-width:38px;
    min-height:38px;
    flex-basis:38px;
  }

  .job-search-form{
    gap:7px;
    padding:8px 9px 8px 12px;
    border-radius:14px;
  }

  .job-search-input{
    height:38px;
    font-size:13px;
  }

  .job-search-button{
    width:32px;
    height:32px;
    min-width:32px;
    min-height:32px;
    flex-basis:32px;
  }
}

@media (max-width:360px){
  :root{
    --page-margin:12px;
  }

  .brand{
    width:160px;
    max-width:70vw;
  }

  .search-form{
    padding-inline:18px;
  }

  .shortcuts{
    gap:5px;
  }
}

@media (max-width:330px){
  .shortcuts{
    max-width:280px;
  }
}

@media (max-height:560px){
  body{
    align-items:center;
  }

  .container{
    padding-block:12px 24px;
  }

  .brand{
    margin-bottom:18px;
  }

  .shortcuts{
    margin-top:16px;
  }
}

@media (max-height:480px) and (orientation:landscape){
  .brand{
    width:166px;
    margin-bottom:14px;
  }

  .shortcuts{
    margin-top:13px;
  }

  .container{
    padding-block:8px 20px;
  }
}

@media (min-width:1200px){
  body{
    padding-inline:clamp(40px,6vw,96px);
  }
}

@media (pointer:coarse){
  .shortcut,
  .theme-button,
  .job-search-button{
    touch-action:manipulation;
  }
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important}
}
</style>

<section class="job-search" aria-label="LinkedIn job search">
  <p class="job-search-label"></p>
  <form class="job-search-form" id="jobSearchForm" role="search" autocomplete="off">
    <label class="sr-only" for="JobTitle">Role or skill</label>
    <input
      class="job-search-input"
      id="JobTitle"
      type="search"
      placeholder="Role / skill"
      aria-label="Role or skill"
      autocomplete="off"
      enterkeyhint="search"
    >
    <div class="job-search-divider" aria-hidden="true"></div>
    <label class="sr-only" for="JobLocation">Location</label>
    <input
      class="job-search-input"
      id="JobLocation"
      type="search"
      placeholder="Loc."
      aria-label="Location"
      autocomplete="off"
      enterkeyhint="search"
    >
    <button class="job-search-button" type="submit" aria-label="Search jobs" title="Search jobs" style="background-color: #07638e55;">
      <!-- <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="10.5" cy="10.5" r="6.7"/>
        <path d="M15.5 15.5 21 21"/>
      </svg> -->
    </button>
  </form>
</section>

</main>

<script>
(() => {
  const button = document.getElementById("themeButton");
  const form = document.querySelector(".search-form");
  const input = document.getElementById("SearchValue");
  const saved = localStorage.getItem("linkedin-home-theme");

  if (saved === "beige") document.body.classList.add("beige");

  button.addEventListener("click", () => {
    document.body.classList.toggle("beige");
    localStorage.setItem(
      "linkedin-home-theme",
      document.body.classList.contains("beige") ? "beige" : "black"
    );
  });

  form.addEventListener("submit", (event) => {
    event.preventDefault();

    const query = input.value.trim();
    if (!query) {
      input.focus();
      return;
    }

    const searchUrl =
      "https://www.linkedin.com/search/results/all/?keywords=" +
      encodeURIComponent(query);

    window.open(searchUrl, "_blank", "noopener,noreferrer");
    form.reset();
  });
})();
</script>


<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>


<script>
(() => {
  const form = document.getElementById("jobSearchForm");
  const titleInput = document.getElementById("JobTitle");
  const locationInput = document.getElementById("JobLocation");

  if (!form || !titleInput || !locationInput) return;

  form.addEventListener("submit", (event) => {
    event.preventDefault();

    const title = titleInput.value.trim();
    const location = locationInput.value.trim();

    if (!title && !location) {
      titleInput.focus();
      return;
    }

    const params = new URLSearchParams();

    if (title) params.set("keywords", title);
    if (location) params.set("location", location);

    const url =
      "https://www.linkedin.com/jobs/search/?" +
      params.toString();

    window.open(url, "_blank", "noopener,noreferrer");

    titleInput.value = "";
    locationInput.value = "";
  });
})();
</script>
